<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE ERA — Owner Dashboard</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><div class="admin-top"><div><div class="kicker">THE ERA / OWNER</div><h1>Orders.</h1><p style="color:#777">Manage every order from one place.</p></div><div class="admin-actions"><button class="btn alt" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="logout()">Log out</button></div></div><div class="stats"><div class="stat"><small>Total orders</small><strong id="totalOrders">0</strong></div><div class="stat"><small>New orders</small><strong id="newOrders">0</strong></div><div class="stat"><small>Revenue</small><strong id="revenue">₹0</strong></div><div class="stat"><small>Delivered</small><strong id="delivered">0</strong></div></div><div class="filters"><input id="search" placeholder="Search order, customer, phone or product..." oninput="loadOrders()"><input id="date" type="date" onchange="loadOrders()"><select id="status" onchange="loadOrders()"><option value="">All statuses</option><option>NEW</option><option>CONFIRMED</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option></select></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th>Placed</th><th>Actions</th></tr></thead><tbody id="orders"></tbody></table></div></div><script>let allOrders=[];const money=n=>"₹"+Number(n).toLocaleString("en-IN");async function loadOrders(){const q=new URLSearchParams({search:document.getElementById("search").value,date:document.getElementById("date").value,status:document.getElementById("status").value});const r=await fetch("/api/admin/orders?"+q);if(r.status===401){location.href="/owner-login.html";return}const j=await r.json();allOrders=j.orders;document.getElementById("totalOrders").textContent=j.stats.total;document.getElementById("newOrders").textContent=j.stats.new;document.getElementById("revenue").textContent=money(j.stats.revenue);document.getElementById("delivered").textContent=j.stats.delivered;render(j.orders)}function render(orders){const b=document.getElementById("orders");if(!orders.length){b.innerHTML='<tr><td colspan="8" style="text-align:center;color:#777;padding:35px">No orders found.</td></tr>';return}b.innerHTML=orders.map(o=>`<tr><td><strong>${o.orderId}</strong><div style="font-size:11px;color:#777;margin-top:5px">${o.email}</div></td><td><strong>${o.name}</strong><div style="font-size:12px;margin-top:4px">${o.phone}</div><div style="font-size:11px;color:#777;margin-top:4px">${o.address}, ${o.city} - ${o.pin}</div></td><td>${o.items.map(i=>`${i.name} × ${i.qty}`).join("<br>")}</td><td><strong>${money(o.total)}</strong></td><td>${o.payment==="cod"?"Cash on Delivery":"UPI"}${o.upiId?`<div style="font-size:11px;color:#777">${o.upiId}</div>`:""}</td><td><span class="status ${o.status}">${o.status}</span></td><td>${new Date(o.createdAt).toLocaleString("en-IN")}</td><td><div class="action-row">${["CONFIRMED","SHIPPED","DELIVERED","CANCELLED"].map(s=>`<button onclick="setStatus('${o.orderId}','${s}')">${s}</button>`).join("")}</div></td></tr>`).join("")}async function setStatus(id,status){const r=await fetch("/api/admin/orders/"+encodeURIComponent(id)+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});if(r.ok)loadOrders();else alert("Unable to update order")}async function logout(){await fetch("/admin/logout",{method:"POST"});location.href="/owner-login.html"}function exportCSV(){const rows=[["Order","Customer","Phone","Email","Address","City","PIN","Items","Total","Payment","UPI ID","Status","Created"]];allOrders.forEach(o=>rows.push([o.orderId,o.name,o.phone,o.email,o.address,o.city,o.pin,o.items.map(i=>`${i.name} x ${i.qty}`).join(" | "),o.total,o.payment,o.upiId||"",o.status,o.createdAt]));const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="the-era-orders.csv";a.click();URL.revokeObjectURL(a.href)}loadOrders();</script></body></html>
