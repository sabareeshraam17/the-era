
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE ERA — Owner Login</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body><div class="login"><div class="kicker">THE ERA / OWNER</div><h1>Owner login.</h1><p style="color:#666;line-height:1.6">Private dashboard for managing customer orders.</p><div id="error"></div><form id="login"><label style="font-size:12px;font-weight:800">PASSWORD</label><input id="password" type="password" required placeholder="Owner password"><button class="btn full">Enter dashboard</button></form><p style="font-size:12px;color:#888;margin-top:18px">The owner password is configured on the server.</p></div><script>document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});const j=await r.json();if(r.ok)location.href="/admin";else document.getElementById("error").innerHTML='<div class="error">'+(j.error||"Login failed")+'</div>'});</script></body></html>
