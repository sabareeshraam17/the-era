<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed — THE ERA</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="container nav-inner"><a class="logo" href="index.html">THE ERA</a><nav class="nav-links"><a href="index.html#shop">Shop</a><a href="era.html">The Era</a></nav><a class="cart-btn" href="order.html">Cart <span class="cart-count" data-cart-count>0</span></a>
<button class="mobile-menu-btn" aria-expanded="false" aria-label="Open menu" onclick="toggleMobileMenu(this)">☰</button>
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html#shop">Shop</a>
  <a href="era.html">The Era</a>
  <a href="order.html">Checkout</a>
  <a href="my-orders.html">My Orders</a>
</div>
</div></header><main class="page container"><div data-success></div></main><footer class="footer"><div class="container footer-inner"><span>© 2026 THE ERA</span><span>Thank you for shopping with us.</span></div></footer><div class="toast"></div><script src="script.js"></script>
<script>
function toggleMobileMenu(btn){
  const m=document.getElementById("mobileMenu");
  if(!m)return;
  const open=!m.classList.contains("open");
  m.classList.toggle("open",open);
  btn.setAttribute("aria-expanded",String(open));
}
document.addEventListener("click",(e)=>{
  const m=document.getElementById("mobileMenu"), b=document.querySelector(".mobile-menu-btn");
  if(!m||!b||!m.classList.contains("open"))return;
  if(!m.contains(e.target)&&!b.contains(e.target)){m.classList.remove("open");b.setAttribute("aria-expanded","false")}
});
</script>
</body></html>
