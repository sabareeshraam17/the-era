<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — THE ERA</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="container nav-inner"><a class="logo" href="index.html">THE ERA</a><nav class="nav-links"><a href="index.html#shop">Shop</a><a href="era.html">The Era</a></nav><a class="cart-btn" href="order.html">Cart <span class="cart-count" data-cart-count>0</span></a></div></header><main class="page container"><div class="kicker">Checkout</div><h1 class="page-title">Your order.</h1><div class="checkout"><section class="panel"><h2>Delivery details</h2><form data-order-form><div class="row"><div class="field"><label>Full name</label><input name="name" required placeholder="Your name"></div><div class="field"><label>Phone</label><input name="phone" required pattern="[0-9 +()-]{8,}" placeholder="+91"></div></div><div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div><div class="field"><label>Address</label><input name="address" required placeholder="House / street / area"></div><div class="row"><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>PIN code</label><input name="pin" required pattern="[0-9]{6}" placeholder="600001"></div></div><h2 style="margin-top:26px">Payment</h2><div class="payment"><label class="pay-option"><input type="radio" name="payment" value="cod" checked><span><strong>Cash on Delivery</strong><small>Pay when your order arrives.</small></span></label><label class="pay-option"><input type="radio" name="payment" value="upi"><span><strong>UPI</strong><small>Enter your UPI ID to continue.</small></span></label></div><div class="field" data-upi-wrap style="display:none"><label>UPI ID</label><input id="upiId" name="upiId" placeholder="name@bank"></div><button class="btn full" type="submit">Place order</button></form></section><aside class="panel"><h2>Order summary</h2><div data-summary></div></aside></div></main><footer class="footer"><div class="container footer-inner"><span>© 2026 THE ERA</span><a href="index.html">Back to shop</a></div></footer><div class="toast"></div><script src="script.js"></script></body></html>
